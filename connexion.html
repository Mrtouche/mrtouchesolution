<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — Mr Touche Solution</title>
<style>
  :root { --bg:#17150c; --panel:#1d1e22; --field:#26282e; --line:#3a3d45; --text:#f4f4f4; --muted:#a3a7b0; --accent:#f4d03f; --link:#f0b24a; --ok:#5fe39a; --bad:#ff7b7b; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:system-ui,Segoe UI,Arial,sans-serif; color:var(--text); background:radial-gradient(70% 80% at 30% 60%, #4a4310 0%, #1f1c0c 55%, #121109 100%); }
  .page { min-height:100%; display:grid; grid-template-columns:1fr minmax(320px,440px); gap:24px; align-items:center; padding:20px 4vw; }

  /* Lampe */
  .stage { display:grid; place-items:center; }
  .stage svg { width:min(420px,90%); height:auto; overflow:visible; }
  #light { transition:opacity .4s; }
  body.off #light, body.off #glow { opacity:0; }
  #pull { cursor:pointer; animation:sway 4s ease-in-out infinite; transform-origin:125px 130px; }
  @keyframes sway { 0%,100%{ transform:rotate(-1.5deg) } 50%{ transform:rotate(1.5deg) } }

  /* Carte */
  .card { background:var(--panel); border-radius:18px; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.45); }
  h1 { margin:0 0 4px; font-size:1.9rem; }
  .sub { margin:0 0 20px; color:var(--muted); }
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:6px; background:var(--field); padding:5px; border-radius:12px; margin-bottom:18px; }
  .tabs button { background:transparent; color:var(--text); border:0; padding:11px; border-radius:9px; font:inherit; font-weight:600; cursor:pointer; }
  .tabs button.on { background:#4a4d56; }
  label { display:block; font-size:.9rem; margin:12px 0 6px; }
  .row { display:flex; justify-content:space-between; align-items:flex-end; }
  .row a { color:var(--link); font-size:.85rem; font-weight:600; cursor:pointer; margin-bottom:6px; }
  input[type=email], input[type=password], input[type=text] { width:100%; padding:13px 14px; border-radius:10px; border:1px solid var(--line); background:var(--field); color:var(--text); font:inherit; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .pw { position:relative; }
  .pw button { position:absolute; right:6px; top:50%; transform:translateY(-50%); background:transparent; border:0; color:var(--muted); cursor:pointer; padding:8px; font-size:1rem; }
  .check { display:flex; align-items:center; gap:8px; margin:14px 0; font-size:.92rem; }
  .check input { accent-color:var(--accent); width:17px; height:17px; }
  .main { width:100%; padding:14px; border:0; border-radius:10px; background:var(--accent); color:#1a1600; font:inherit; font-weight:700; cursor:pointer; }
  .main:disabled { opacity:.6; cursor:wait; }
  .or { text-align:center; color:var(--muted); font-size:.78rem; letter-spacing:.06em; margin:20px 0 12px; }
  .social { width:100%; padding:13px; margin-bottom:10px; border-radius:10px; border:1px solid var(--line); background:var(--field); color:var(--text); font:inherit; font-weight:600; cursor:pointer; }
  .social b { color:var(--link); margin-right:8px; }
  #msg { min-height:1.3em; margin-top:8px; font-size:.92rem; }
  #msg.err { color:var(--bad); } #msg.ok { color:var(--ok); }

  @media (max-width:820px) { .page { grid-template-columns:1fr; } .stage { display:none; } }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<script src="./cookies.js" defer></script><body>
<div class="page">

  <!-- Lampe (dessinée en SVG, cliquez sur le cordon jaune pour éteindre/allumer) -->
  <div class="stage">
    <svg viewBox="0 0 260 380" aria-hidden="true">
      <defs>
        <radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe98a" stop-opacity=".55"/><stop offset="1" stop-color="#ffe98a" stop-opacity="0"/></radialGradient>
        <linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4e04a" stop-opacity=".95"/><stop offset="1" stop-color="#c9b52a" stop-opacity=".55"/></linearGradient>
      </defs>
      <circle id="glow" cx="125" cy="135" r="95" fill="url(#g)"/>
      <polygon id="light" points="85,138 165,138 250,345 40,345" fill="url(#r)"/>
      <path d="M55 130 A70 62 0 0 1 195 130 Z" fill="#1b1b20"/>
      <line x1="88" y1="132" x2="62" y2="222" stroke="#25262c" stroke-width="5" stroke-linecap="round"/>
      <circle cx="62" cy="222" r="12" fill="#f4d03f"/>
      <g id="pull">
        <line x1="125" y1="132" x2="125" y2="225" stroke="#f4d03f" stroke-width="3"/>
        <circle cx="125" cy="228" r="11" fill="#f4d03f"/>
      </g>
      <ellipse cx="105" cy="348" rx="55" ry="7" fill="#25262c"/>
      <circle cx="104" cy="346" r="12" fill="#f4d03f"/>
    </svg>
  </div>

  <!-- Formulaire -->
  <main class="card">
    <h1>Bienvenue</h1>
    <p class="sub">Connectez-vous pour accéder au site</p>

    <div class="tabs">
      <button id="tabLogin" class="on" type="button">Connexion</button>
      <button id="tabSignup" type="button">Inscription</button>
    </div>

    <form id="form">
      <label for="email">E-mail</label>
      <input id="email" type="email" placeholder="Entrez votre e-mail" autocomplete="email" required>

      <div class="row"><label for="mdp">Mot de passe</label><a id="forgot" tabindex="0">Oublié ?</a></div>
      <div class="pw">
        <input id="mdp" type="password" placeholder="Entrez votre mot de passe" autocomplete="current-password" required>
        <button id="eye" type="button" aria-label="Afficher le mot de passe">👁</button>
      </div>

      <label class="check"><input id="remember" type="checkbox" checked> Se souvenir de moi</label>
      <button id="submit" class="main" type="submit">Se connecter →</button>
    </form>

    <div class="or">OU CONTINUER AVEC</div>
    <button id="google" class="social" type="button"><b>G</b>Continuer avec Google</button>
    <button id="github" class="social" type="button"><b>⌥</b>Continuer avec GitHub</button>
    <div id="msg" role="status"></div>
  </main>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signInWithPopup, GoogleAuthProvider, GithubAuthProvider, setPersistence, browserLocalPersistence,
  browserSessionPersistence, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { firebaseConfig } from "./firebase-config.js";

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const auth = getAuth(app);
const $ = (id) => document.getElementById(id);
let mode = "login";

const msg = (t, type = "err") => { $("msg").textContent = t; $("msg").className = type; };

const erreurs = {
  "auth/invalid-credential": "E-mail ou mot de passe incorrect.",
  "auth/invalid-email": "E-mail invalide.",
  "auth/email-already-in-use": "Ce compte existe déjà.",
  "auth/weak-password": "Mot de passe trop faible (6 caractères minimum).",
  "auth/popup-closed-by-user": "Connexion annulée.",
  "auth/unauthorized-domain": "Domaine non autorisé dans Firebase.",
  "auth/account-exists-with-different-credential": "Un compte existe déjà avec cet e-mail via une autre méthode.",
  "auth/too-many-requests": "Trop d’essais. Réessayez plus tard.",
  "auth/network-request-failed": "Problème de réseau."
};
const erreur = (e) => msg(erreurs[e.code] || "Erreur : " + (e.code || e.message));

if (location.protocol === "file:") msg("Ouvrez le site avec Live Server (pas en double-clic).");

// Déjà connecté avec un vrai compte ? Direction le site (les visiteurs anonymes sont ignorés)
onAuthStateChanged(auth, (u) => { if (u && !u.isAnonymous) location.replace("index.html"); });

function setMode(m) {
  mode = m;
  $("tabLogin").classList.toggle("on", m === "login");
  $("tabSignup").classList.toggle("on", m === "signup");
  $("submit").textContent = m === "login" ? "Se connecter →" : "Créer mon compte →";
  $("mdp").autocomplete = m === "login" ? "current-password" : "new-password";
  msg("", "");
}
$("tabLogin").onclick = () => setMode("login");
$("tabSignup").onclick = () => setMode("signup");
$("eye").onclick = () => { $("mdp").type = $("mdp").type === "password" ? "text" : "password"; };
$("pull").onclick = () => document.body.classList.toggle("off");

async function persistance() {
  await setPersistence(auth, $("remember").checked ? browserLocalPersistence : browserSessionPersistence);
}

async function connexionSociale(provider) {
  msg("");
  try { await persistance(); await signInWithPopup(auth, provider); location.replace("index.html"); }
  catch (err) { erreur(err); }
}
$("google").onclick = () => connexionSociale(new GoogleAuthProvider());
$("github").onclick = () => connexionSociale(new GithubAuthProvider());

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("submit").disabled = true; msg("");
  try {
    await persistance();
    const email = $("email").value.trim(), pass = $("mdp").value;
    if (mode === "login") await signInWithEmailAndPassword(auth, email, pass);
    else await createUserWithEmailAndPassword(auth, email, pass);
    msg("Connexion réussie…", "ok");
    location.replace("index.html");
  } catch (err) { erreur(err); }
  $("submit").disabled = false;
});

$("forgot").onclick = async () => {
  const email = $("email").value.trim();
  if (!email) return msg("Entrez d’abord votre e-mail.");
  try { await sendPasswordResetEmail(auth, email); msg("E-mail de réinitialisation envoyé.", "ok"); }
  catch (err) { erreur(err); }
};
</script>

<script type="module" src="./tracker.js"></script>
</body>
</html>
